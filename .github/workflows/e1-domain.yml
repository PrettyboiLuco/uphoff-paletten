name: E1 Domain Gate

concurrency:
  group: e1-domain-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:e1
