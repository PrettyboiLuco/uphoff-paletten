name: E2.1 Persistence Gate

concurrency:
  group: e2-1-persistence-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - build/pwa-v1
  pull_request:

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:e21
