name: E7 Release Gate

concurrency:
  group: e7-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:release-unit
      - run: npm run test:e23
      - run: npm run test:e7-adapter
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e4-browser
      - run: npm run test:e5-browser
      - run: npm run test:e6-browser
      - run: npm run test:e7-pwa
