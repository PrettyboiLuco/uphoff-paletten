name: E4 UI Gate

concurrency:
  group: e4-ui-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  ui-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:e4

  ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e4-browser
