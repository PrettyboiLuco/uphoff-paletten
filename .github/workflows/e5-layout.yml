name: E5 Layout Gate

concurrency:
  group: e5-layout-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - build/pwa-v1
  pull_request:

jobs:
  layout-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:e5

  layout-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e5-browser
